<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fluffy Industries - Thin Client</title>
    <!-- Inline critical CSS to prevent black-on-black if external CSS fails -->
    <style>
      body {
        background-color: #222 !important;
        color: #fff !important;
        font-family: sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
      }
      #ui-container {
        background-color: #333;
        padding: 2rem;
        border-radius: 10px;
        text-align: center;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        max-width: 500px;
        width: 90%;
        z-index: 10;
      }
      .hidden {
        display: none !important;
      }
    </style>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="ui-container">
      <h1>Fluffy Industries</h1>

      <div id="loading-container">
        <div
          id="progress-bar"
          style="
            width: 100%;
            height: 20px;
            background: #444;
            border-radius: 10px;
            margin: 15px 0;
            overflow: hidden;
          "
        >
          <div
            id="progress-fill"
            style="
              width: 0%;
              height: 100%;
              background: #007bff;
              transition: width 0.3s;
            "
          ></div>
        </div>
        <p id="status-text">Checking Service Worker...</p>
      </div>

      <div id="commit-container" class="hidden">
        <div class="commit-header">LATEST COMMIT</div>
        <div id="commit-name">Loading commit...</div>
        <div id="commit-desc" class="hidden"></div>
        <div id="commit-meta"></div>
      </div>

      <div id="button-container" class="hidden">
        <button id="clear-btn">Force Redownload</button>
      </div>
    </div>

    <div id="game-container" class="hidden">
      <iframe
        id="game-iframe"
        allow="autoplay; fullscreen; pointer-lock"
        style="width: 100vw; height: 100vh; border: none; display: block"
      ></iframe>
    </div>

    <script src="client.js"></script>
  </body>
</html>
